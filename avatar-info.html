<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Avatars: character select</title>
  </head>
  <body>
    <div id="page" class="page">
      <div id="strip" class="strip">
        <div class="plate"></div>
        <div class="banner">CHOOSE YOUR AVATAR</div>
        <div class="hint">
          type <b>!avatar</b> + words in chat<br />
          e.g. <b>!avatar skinny 3 long</b><br />
          hair: <b>short spiky long bun</b><br />
          skin: <span id="skins" class="skins"></span><br />
          your pick is remembered!
        </div>
        <div id="hairstyles" class="hairstyles"><span class="caption">hair:</span></div>
        <div id="lineup" class="lineup"></div>
      </div>
    </div>
    <script type="module" src="/src/info/stripPage.ts"></script>
  </body>
</html>
